            perspective: 1000px;

        .page-flip {

            transform-style: preserve-3d;
            transform-origin: left center;
        }
        
        @keyframes flip {
            0% { transform: rotateY(0deg); opacity: 0; }

<!-- Script to simulate completion state after a few seconds -->
<script>
        setTimeout(() => {
            const h1 = document.querySelector('h1');
            const p = document.querySelector('h1 + p');
            const progressContainer = document.querySelector('.w-full.mb-lg');
            const optionsContainer = document.querySelector('.w-full.bg-surface-container-low');
            const cancelButton = document.querySelector('button');
            const animationContainer = document.querySelector('.page-flip-container');
            const coverImage = document.querySelector('.bg-surface.rounded-lg.z-10');

            if(h1 && p && progressContainer && optionsContainer && cancelButton && animationContainer && coverImage) {
                // Update text
                h1.textContent = 'Conversion Complete';
                h1.classList.replace('text-primary', 'text-secondary');
                p.textContent = 'PDF saved to your Downloads.';
                
                // Hide progress and options
                progressContainer.style.display = 'none';
                optionsContainer.style.display = 'none';

                // Update Button
                cancelButton.innerHTML = '<span class="material-symbols-outlined text-[20px]">folder_open</span> Open File';
                cancelButton.className = 'w-full py-md px-lg bg-secondary-container text-on-secondary-container rounded-xl font-label-lg text-label-lg hover:bg-secondary-container/80 transition-colors flex items-center justify-center gap-sm mt-md';

                // Stop flipping animation and show success state on cover
                const flipPages = document.querySelectorAll('.page-flip');
                flipPages.forEach(page => page.style.display = 'none');
                
                // Add success checkmark to cover
                const checkmark = document.createElement('div');
                checkmark.className = 'absolute inset-0 bg-secondary/20 flex items-center justify-center backdrop-blur-sm z-30 transition-opacity duration-500 opacity-0';
                checkmark.innerHTML = '<div class="w-16 h-16 rounded-full bg-secondary flex items-center justify-center shadow-lg transform scale-50 transition-transform duration-500 delay-100" id="success-icon-bg"><span class="material-symbols-outlined text-on-secondary text-[32px]">check</span></div>';
                coverImage.appendChild(checkmark);
                
                // Trigger reflow
                void checkmark.offsetWidth;
                
                checkmark.classList.remove('opacity-0');
                checkmark.classList.add('opacity-100');
                setTimeout(() => {
                    document.getElementById('success-icon-bg').classList.remove('scale-50');
                    document.getElementById('success-icon-bg').classList.add('scale-100');
                }, 50);

                // Add a primary button for reading
                const readButton = document.createElement('button');
                readButton.innerHTML = '<span class="material-symbols-outlined text-[20px]">auto_stories</span> Read Now';
                readButton.className = 'w-full py-md px-lg bg-primary text-on-primary rounded-xl font-label-lg text-label-lg hover:bg-primary/90 transition-colors flex items-center justify-center gap-sm mt-md shadow-lg';
                
                cancelButton.parentNode.insertBefore(readButton, cancelButton);
            }
        }, 5000); // Simulate completion after 5 seconds
    </script>
